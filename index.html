<!DOCTYPE html>
<html>
<head>
  <title>Our Electronic Home</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
    }
    .equation {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 8rem;
    }
    .equation > span {
      color: #8a7a6b;
      font-weight: 300;
    }
    .box {
      width: 12rem;
      height: 12rem;
      border: 4px solid;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #1e3a8a;
    }
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 0.5rem;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="equation">
    <div class="box" style="background-color: #4a90e2; border-color: #2c5f9e;">m</div>
    <span>+</span>
    <div class="box" style="background-color: #7ed321; border-color: #5a9e18; color: #2d5016;">d</div>
    <span>=</span>
    <div class="box" style="background-color: #f5a623; border-color: #c4831c; color: #4a2500;">a</div>
  </div>
  <footer>&copy; 2026 Darren McDonald</footer>
</body>
</html>
